<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家庭日報產生器</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@400;700;900&display=swap">
<style>
:root{--bg:#eef2f5;--panel:#fff;--ink:#17232d;--mute:#5d6b76;--line:#d5dde3;--acc:#0b6e6e;--acc-ink:#fff;--field:#f6f8fa;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181e;--panel:#18232b;--ink:#e8eef2;--mute:#9aa9b4;--line:#2b3a45;--acc:#4fc3bd;--acc-ink:#062423;--field:#1f2d37}}
:root[data-theme="dark"]{--bg:#10181e;--panel:#18232b;--ink:#e8eef2;--mute:#9aa9b4;--line:#2b3a45;--acc:#4fc3bd;--acc-ink:#062423;--field:#1f2d37}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang HK","Microsoft JhengHei",sans-serif;line-height:1.6}
.top{padding:22px 20px 6px;max-width:1240px;margin:0 auto}
.top h1{font:900 1.7rem/1.2 "Noto Serif TC","Songti TC",serif;margin:0 0 4px}
.top p{margin:0;color:var(--mute);font-size:.95rem}
.wrap{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:20px;max-width:1240px;margin:0 auto;padding:14px 20px 40px;align-items:start}
@media(max-width:860px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel h2{font-size:1rem;margin:18px 0 8px}
.panel h2:first-child{margin-top:0}
label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 3px}
input[type=text],input[type=date],textarea{width:100%;font:inherit;font-size:.95rem;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{min-height:76px;resize:vertical}
input:focus,textarea:focus,button:focus-visible,.tpl:focus-within{outline:2px solid var(--acc);outline-offset:1px}
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tpl{position:relative;border:2px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;background:var(--field);font-size:.85rem}
.tpl input{position:absolute;opacity:0}
.tpl.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.sw{height:38px;border-radius:6px;margin-bottom:6px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.95rem}
.sw.classic{background:#f3f0e8;color:#111;border:1px solid #111;font-family:"Noto Serif TC",serif}
.sw.kids{background:#ffd23f;color:#d7263d;border:3px solid #1b1b3a;border-radius:14px}
.sw.modern{background:#fff;color:#111;border-bottom:4px solid #ff4d2e;border-radius:0}
.sw.vintage{background:#e7d3a8;color:#5a3a1a;border:3px double #5a3a1a;font-family:"Noto Serif TC",serif}
.tpl b{display:block}.tpl span{color:var(--mute);font-size:.78rem}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
.checks label{display:flex;gap:6px;align-items:center;margin:4px 0;color:var(--ink)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
button{font:inherit;font-size:.92rem;border-radius:9px;padding:9px 14px;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
.note{font-size:.78rem;color:var(--mute);margin-top:12px}
.stage{overflow-x:auto}
/* PAPER */
.paper{--p:#fff;--t:#111;--a:#b00;--r:#111;width:100%;max-width:794px;min-height:1000px;margin:0 auto;padding:30px 34px;background:var(--p);color:var(--t);box-shadow:0 6px 24px rgba(0,0,0,.18);font-family:"Noto Serif TC","Songti TC",serif;line-height:1.55}
.paper h3,.paper h4,.paper p,.paper ul{margin:0}
.mast{text-align:center;border-bottom:3px double var(--r);padding-bottom:10px}
.mast .name{font-size:3rem;font-weight:900;line-height:1.15;letter-spacing:.08em}
.dateline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.82rem;border-bottom:1px solid var(--r);padding:5px 0;margin-bottom:14px}
.head{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--r)}
.head h3{font-size:2.1rem;font-weight:900;line-height:1.25;margin-bottom:6px}
.head p{white-space:pre-wrap;columns:2;column-gap:20px;text-align:justify;font-size:.95rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px}
.box h4{font-size:1.05rem;font-weight:900;border-bottom:2px solid var(--r);margin-bottom:6px;padding-bottom:2px}
.box ul{list-style:none;padding:0;font-size:.92rem}
.box li{padding:3px 0;border-bottom:1px dotted #9a9a9a}
.box li i{font-style:normal;font-weight:700;color:var(--a);margin-right:6px}
.box p{font-size:.92rem;white-space:pre-wrap}
.box.wide{grid-column:1/-1}
.quote p{font-size:1.25rem;font-weight:700;text-align:center;line-height:1.5}
.foot{margin-top:16px;border-top:3px double var(--r);padding-top:6px;text-align:center;font-size:.75rem}
.empty{color:#888;font-size:.9rem}
.head .tag{display:inline-block;font:700 .8rem "Noto Sans TC",sans-serif;border:1px solid var(--r);padding:1px 12px;border-radius:99px;margin-bottom:8px}
.head h3{font-size:2.5rem}
.head p{font-size:1.1rem;line-height:1.95}
.head p::first-letter{font-size:2.6em;font-weight:900;float:left;line-height:1;margin:.04em .1em 0 0;color:var(--a)}
.think{margin-top:12px;padding:8px 12px;border:2px dashed var(--a);border-radius:8px;font-size:.95rem}
.think b{display:block;color:var(--a)}
.box.joke p,.box.iq p{font-size:1.02rem}
.box p.punch{margin-top:8px;font-weight:900;color:var(--a);font-size:1.15rem}
.box p.mine{margin-top:10px;border-top:1px dashed var(--r);padding-top:6px}
.box p.hint{font-size:.74rem;color:#777;margin-top:6px}
.box p.ans{transform:rotate(180deg);text-align:right;font-size:.85rem;margin-top:2px}
.corner{margin-top:16px;border-top:2px solid var(--r);padding-top:6px}
.ct{font-size:.9rem;margin-bottom:6px}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 16px}
.corner .box h4{font-size:.85rem}
.corner .box ul,.corner .box p{font-size:.8rem}
.corner .quote p{font-size:1rem}
.rm li{padding-left:1.3em;position:relative}
.cid{font-weight:400;font-size:.7rem;opacity:.6;letter-spacing:0}
.fbwrap{width:calc(100% - 40px);max-width:1200px;margin:0 auto 40px}
.fbwrap fieldset{border:1px solid var(--line);border-radius:10px;margin:0 0 12px;padding:8px 14px 10px;min-width:0}
.fbwrap legend{font-weight:700;font-size:.95rem;padding:0 6px}
.opt{display:inline-flex;align-items:center;gap:6px;margin:4px 14px 4px 0;color:var(--ink);font-size:.92rem}
.fbwrap textarea{min-height:70px}
.fbok{font-weight:700;color:var(--acc)}
.fbmail{margin-left:8px;color:var(--acc)}
.rm li::before{content:"";position:absolute;left:0;top:.5em;width:.75em;height:.75em;border:1.5px solid var(--r);border-radius:2px}
select{width:100%;font:inherit;font-size:.95rem;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
select:focus{outline:2px solid var(--acc);outline-offset:1px}
.chip{margin:0 6px 6px 0;padding:4px 12px;border-radius:99px;font-size:.85rem}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
.paper[data-age=a] .head p{columns:1;font-size:1.45rem;line-height:2.1}
.paper[data-age=a] .head h3{font-size:2.8rem}
.paper[data-age=c] .head p,.paper[data-age=d] .head p{font-size:1.02rem;line-height:1.85}
.paper[data-age=d] .head p::first-letter{float:none;font-size:inherit;margin:0;color:inherit}
.kids .tag{background:#fff}.kids .think{background:#fff;border-color:#d7263d}
.modern .tag{background:#ff4d2e;color:#fff;border-color:#ff4d2e}
@media(max-width:640px){.cgrid{grid-template-columns:1fr}.head h3{font-size:1.7rem}}
/* kids */
.paper.kids{--p:#fff7d6;--t:#1b1b3a;--a:#d7263d;--r:#1b1b3a;font-family:"Noto Sans TC",sans-serif;border:6px solid #1b1b3a;border-radius:26px}
.kids .mast{border:0;background:#ff6b9d;color:#fff;border-radius:20px;padding:10px;transform:rotate(-1deg)}
.kids .mast .name{font-weight:900;letter-spacing:.04em;text-shadow:3px 3px 0 #1b1b3a}
.kids .dateline{border:0;justify-content:center;font-weight:700;margin-top:10px}
.kids .head{background:#4cc9f0;border:4px solid #1b1b3a;border-radius:18px;padding:14px}
.kids .head p{columns:1}
.kids .box{border:3px solid #1b1b3a;border-radius:18px;padding:10px 12px;background:#fff}
.kids .box:nth-child(3n+1){background:#caffbf}.kids .box:nth-child(3n+2){background:#ffd6a5}.kids .box:nth-child(3n){background:#e0c3fc}
.kids .box h4{border:0;font-size:1.15rem}
.kids .box li{border-bottom:2px dashed #1b1b3a55}
.kids .foot{border:0}
/* modern */
.paper.modern{--p:#fff;--t:#121212;--a:#ff4d2e;--r:#121212;font-family:"Noto Sans TC",sans-serif}
.modern .mast{text-align:left;border:0;border-bottom:8px solid #ff4d2e}
.modern .mast .name{font-size:3.4rem;letter-spacing:-.01em;line-height:1.1}
.modern .dateline{border:0;color:#555;padding:8px 0}
.modern .head{border:0;background:#f4f4f2;padding:18px}
.modern .head h3{font-size:2.4rem}
.modern .head p{columns:1;max-width:60ch}
.modern .box h4{border:0;color:#ff4d2e;font-size:.95rem;border-left:5px solid #ff4d2e;padding-left:8px}
.modern .box li{border-bottom:1px solid #e3e3e0}
.modern .foot{border:0;color:#777}
/* vintage */
.paper.vintage{--p:#ecdcb3;--t:#3b2813;--a:#8c2f1b;--r:#3b2813;border:8px double #3b2813;background-image:radial-gradient(rgba(90,58,26,.12) 1px,transparent 1.5px);background-size:7px 7px}
.vintage .mast .name{font-size:3.2rem;letter-spacing:.14em;text-shadow:1px 1px 0 #c9b27c}
.vintage .head h3{font-style:normal;text-align:center}
.vintage .box{border:1px solid #3b2813;padding:8px 10px}
.vintage .box h4{text-align:center;border-bottom:1px solid #3b2813;font-size:1rem;letter-spacing:.2em}
@media(max-width:640px){.paper{padding:18px 16px;min-height:0}.mast .name{font-size:2.1rem!important}.head h3{font-size:1.5rem!important}.head p{columns:1}.grid{grid-template-columns:1fr}}
@media print{
@page{size:A4;margin:8mm}
body{background:#fff}
.top,.panel{display:none!important}
.wrap{display:block;padding:0;max-width:none}
.stage{overflow:visible}
.paper{box-shadow:none;max-width:none;width:100%;min-height:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
:root{padding:0}
}
</style>
</head>
<body>
<header class="top">
<button type="button" id="ui" style="float:right" aria-label="Language / 語言"></button><button type="button" id="fbgo" style="float:right;margin-right:8px"></button>
<h1>家庭日報產生器</h1>
<p>每日一個故事、一個笑話、一條 IQ 題，印成一份孩子自己想睇嘅報紙。唔使安裝，唔使連接 Calendar，行程只係細細格。</p>
</header>
<main class="wrap">
<section class="panel" aria-label="編輯內容">
<h2>先揀：孩子同興趣</h2>
<label for="kid">孩子稱呼（選填）</label>
<input type="text" id="kid" data-k="kid" placeholder="例如：小明">
<label for="age">年齡組別</label>
<select id="age" data-k="age"><option value="a">4–6 歲　簡單故事、圖片猜謎</option><option value="b">7–10 歲　故事、笑話、謎題</option><option value="c">11–14 歲　邏輯、科學趣聞、短篇</option><option value="d">15 歲或以上　Brain Teasers、趣味知識</option></select>
<label for="lvl">閱讀能力（字數只係起點，可按孩子調整）</label>
<select id="lvl" data-k="lvl"><option value="0.7">稍淺（字數少約三成）</option><option value="1">標準</option><option value="1.3">稍深（字數多約三成）</option></select>
<label for="lang">中文風格</label>
<select id="lang" data-k="lang"><option value="en">English</option><option value="yue">廣東話口語</option><option value="zh">書面中文</option><option value="bi">English + 中文</option></select>
<label>有興趣嘅主題（可多選，唔揀就隨機）</label>
<div class="chips" id="chips"></div>
<button class="pri" type="button" id="gen" style="margin-top:12px;width:100%">生成今日內容</button>
<p class="note" id="stat"></p>

<h2>1. 揀設計</h2>
<div class="tpls" id="tpls"></div>

<h2>2. 基本資料</h2>
<label for="fam">家姓或家庭名稱</label>
<input type="text" id="fam" data-k="fam" placeholder="例如：陳">
<label for="title">報紙名稱（留空會自動用「家姓＋家日報」）</label>
<input type="text" id="title" data-k="title" placeholder="例如：陳家日報">
<label for="date">日期</label>
<input type="date" id="date" data-k="date">
<label for="weather">天氣／心情</label>
<input type="text" id="weather" data-k="weather" placeholder="例如：晴天 26°C，記得帶遮">

<h2>3. 今日小故事（報紙最大版面）</h2>
<button type="button" data-pick="story" style="font-size:.82rem;padding:5px 10px">換個故事</button>
<label for="hl">故事標題</label>
<input type="text" id="hl" data-k="hl">
<label for="story">故事內容（建議 150 至 400 字，分段請空一行）</label>
<textarea id="story" data-k="story" style="min-height:160px"></textarea>
<label for="think">讀後想一想（一條問題，等孩子開口講）</label>
<input type="text" id="think" data-k="think">

<h2>4. 笑話同 IQ 題</h2>
<button type="button" data-pick="joke" style="font-size:.82rem;padding:5px 10px">換個笑話</button>
<button type="button" data-pick="iq" style="font-size:.82rem;padding:5px 10px">換條 IQ 題</button>
<label for="joke">笑話（問題或開頭）</label>
<input type="text" id="joke" data-k="joke">
<label for="punch">爆笑答案</label>
<input type="text" id="punch" data-k="punch">
<label for="iq">IQ 題</label>
<textarea id="iq" data-k="iq"></textarea>
<label for="ans">IQ 答案（會倒轉印喺報紙上，孩子要轉頭睇）</label>
<input type="text" id="ans" data-k="ans">

<h2>5. 屋企小站（每行一項，只佔細細格）</h2>
<label for="remind">給孩子嘅今日小叮嚀（每行一項）</label>
<textarea id="remind" data-k="remind"></textarea>
<label for="sched">今日行程（可寫「時間 事項」）</label>
<textarea id="sched" data-k="sched"></textarea>
<label for="chores">家務分工（可寫「名字：事項」）</label>
<textarea id="chores" data-k="chores"></textarea>
<label for="dinner">今晚食乜</label>
<input type="text" id="dinner" data-k="dinner">
<label for="bday">生日／紀念日／提醒</label>
<input type="text" id="bday" data-k="bday">
<label for="chal">家庭小挑戰</label>
<input type="text" id="chal" data-k="chal">
<label for="quote">今日金句</label>
<input type="text" id="quote" data-k="quote">

<h2>6. 顯示邊啲欄目</h2>
<div class="checks" id="checks"></div>

<div class="btns">
<button class="pri" id="print">列印／儲存 PDF</button>
<button id="sample">重新填範例</button>
<button id="clear">清空</button>
</div>
<p class="note">列印時請揀「儲存為 PDF」或你部打印機。內容只存喺你自己部瀏覽器，唔會上傳。</p>
</section>
<section class="stage" aria-label="報紙預覽"><article class="paper classic" id="paper"></article></section>
</main>
<section class="panel fbwrap" id="fb"></section>
<script>
(function(){
var TPL=[
{id:'classic',n:'經典報紙',d:'黑白大報，嚴肅得嚟好得意'},
{id:'kids',n:'小朋友版',d:'鮮豔色彩，啱小朋友睇'},
{id:'modern',n:'簡約現代',d:'留白乾淨，一點橙紅'},
{id:'vintage',n:'懷舊舊報',d:'泛黃紙張，老香港味'}];
var SEC=[['story','今日小故事'],['joke','笑話'],['iq','IQ 題'],['remind','今日小叮嚀'],['sched','今日行程'],['chores','家務分工'],['dinner','今晚餐單'],['bday','生日提醒'],['chal','家庭小挑戰'],['quote','今日金句']];
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
var SAMPLE={tpl:'classic',age:'b',topics:[],lvl:'1',lang:'yue',kid:'',fam:'陳',title:'',date:today(),weather:'天晴，約 26°C，出門記得塗防曬',
hl:'會唱歌嘅小雲朵',
story:'有一朵小雲朵，叫阿綿。其他雲朵都識落雨，只有阿綿唔識，佢覺得好慚愧。\n\n有日，山下嘅花兒全部低下頭，原來好耐冇落雨，花兒好口渴。阿綿落唔到雨，但佢識唱歌。佢大聲唱起歌嚟，歌聲傳到好遠，其他雲朵聽到，都飄過嚟一齊合唱。\n\n雲朵越聚越多，天色慢慢變暗，嘩啦嘩啦，雨水終於落喺花兒身上。阿綿笑咗：原來唔識落雨都緊要，因為我識得叫朋友一齊幫手。',
think:'如果你係阿綿，你會點樣叫朋友幫手？',
joke:'乜嘢床唔可以瞓？',punch:'河床！瞓落去會濕曬！',
iq:'找規律：1、2、4、7、11，下一個數字係乜？',ans:'16（每次加多 1、2、3、4、5）',
sched:'7:30 早餐，準備出門\n8:15 小朋友返學\n15:30 接放學\n18:30 全家晚飯\n20:00 家庭桌遊時間',
chores:'爸爸：煮晚飯\n媽媽：洗衫、摺衫\n大仔：倒垃圾\n細妹：收拾玩具',
dinner:'蒜蓉蒸蝦、炒菜心、冬瓜湯',remind:'多飲水，記得帶水壺返學\n下晝 3 點有師傅上嚟整洗衣機，放學直接返屋企\n食零食之前要洗手',bday:'後日係婆婆生日，記得打電話',chal:'今晚飯桌上，每人講一件今日最開心嘅事',
quote:'一家人齊齊整整，就係最好嘅一餐。',

function fbRender(){var i=L==='en'?1:0,h='<h2>'+['試玩意見問卷（約 3 分鐘）','Feedback survey (about 3 minutes)'][i]+'</h2><p><b>'+['試玩任務：','Your mission: '][i]+'</b>'+['選孩子的年齡和 2 個主題，生成一份報紙，換一個設計，再用「列印／儲存 PDF」匯出，最好拿給孩子看，觀察他們願不願意讀。','Pick your child’s age and 2 topics, generate a newspaper, switch to another design, then export it with “Print / Save as PDF”. If you can, show it to your child and see whether they want to read it.'][i]+'</p><form id="fbf">';
FQ.forEach(function(q,n){var id='q'+(n+1),b='',o=q.o?(Array.isArray(q.o[0])?q.o[i]:q.o):[];
if(q.y==='x')b='<textarea name="'+id+'"></textarea>';
else o.forEach(function(v){b+='<label class="opt"><input type="'+(q.y==='c'?'checkbox':'radio')+'" name="'+id+'" value="'+esc(v)+'"> '+esc(v)+'</label>'});
h+='<fieldset><legend>'+(n+1)+'. '+q.t[i]+'</legend>'+b+'</fieldset>'});
h+='<p class="note">'+['請勿填寫孩子的全名或其他私人資料。','Please do not include your child’s full name or other private details.'][i]+'</p><div class="btns"><button class="pri" type="submit">'+['送出意見','Send feedback'][i]+'</button></div></form><div id="fbout"></div>';
document.getElementById('fb').innerHTML=h;
document.getElementById('fbf').onsubmit=function(e){e.preventDefault();fbSend()};
var g=document.getElementById('fbgo');g.textContent=['試玩意見','Feedback'][i];g.onclick=function(){document.getElementById('fb').scrollIntoView({behavior:'smooth'})}}
function fbText(){var f=document.getElementById('fbf'),i=L==='en'?1:0,r=['Family Newspaper feedback ('+(L==='en'?'English':'Chinese')+' version)'];
FQ.forEach(function(q,n){var id='q'+(n+1),v=[];f.querySelectorAll('[name='+id+']').forEach(function(e){if(q.y==='x'){if(e.value.trim())v.push(e.value.trim())}else if(e.checked)v.push(e.value)});r.push((n+1)+'. '+q.t[i]+'\n   '+(v.join(' / ')||'-'))});
r.push('---','Age setting: '+(S.age||'b')+' | Topics: '+(S.topics.join(',')||'-')+' | Design: '+S.tpl+' | IDs: '+([S.sid,S.jid,S.qid].filter(Boolean).join('/')||'-'));return r.join('\n')}
function fbData(){var f=document.getElementById('fbf'),d={time:new Date().toISOString(),ui:L};
FQ.forEach(function(q,n){var id='q'+(n+1),v=[];f.querySelectorAll('[name='+id+']').forEach(function(e){if(q.y==='x'){if(e.value.trim())v.push(e.value.trim())}else if(e.checked)v.push(e.value)});d[id]=v.join(' / ')});
d.age=S.age||'b';d.topics=S.topics.join(',');d.design=S.tpl;d.ids=[S.sid,S.jid,S.qid].filter(Boolean).join('/');return d}
async function fbSend(){var o=document.getElementById('fbout'),i=L==='en'?1:0,t=fbText(),ok=false;
if(FB_URL){try{await fetch(FB_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(fbData())});ok=true}catch(e){}}
if(ok){o.innerHTML='<p class="fbok">'+['謝謝你的意見！','Thank you for your feedback!'][i]+'</p>';return}
o.innerHTML='<p>'+['請按「複製」，再把內容傳給邀請你試玩的朋友。','Please press “Copy” and send the text to the friend who invited you.'][i]+'</p><textarea id="fbta" readonly style="min-height:200px"></textarea><div class="btns"><button type="button" id="fbcp">'+['複製','Copy'][i]+'</button>'+(FB_MAIL?'<a class="fbmail" href="mailto:'+FB_MAIL+'?subject='+encodeURIComponent('Family Newspaper feedback')+'&body='+encodeURIComponent(t)+'">'+['用電郵傳送','Send by email'][i]+'</a>':'')+'</div>';
var ta=document.getElementById('fbta');ta.value=t;
document.getElementById('fbcp').onclick=function(){ta.select();try{navigator.clipboard.writeText(t)}catch(e){document.execCommand('copy')}}}
fixLang();
chips();
sync();render();apply();fbRender();
})();
</script>
